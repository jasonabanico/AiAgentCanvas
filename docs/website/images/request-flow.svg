<svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/></marker></defs>
  <rect width="800" height="900" rx="12" fill="#0f172a"/>
  <text x="400" y="34" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="600">Request Flow</text>
  <rect x="150" y="58" width="500" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="124" cy="84.0" r="13" fill="#3b82f6"/>
  <text x="124" y="88.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">1</text>
  <text x="400" y="80" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Browser</text>
  <text x="400" y="98" text-anchor="middle" fill="#94a3b8" font-size="10.5">The user types in the Chat tab</text>
  <line x1="400" y1="110" x2="400" y2="130" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="132" width="500" height="52" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="124" cy="158.0" r="13" fill="#3b82f6"/>
  <text x="124" y="162.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">2</text>
  <text x="400" y="154" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">POST /api/copilotkit</text>
  <text x="400" y="172" text-anchor="middle" fill="#94a3b8" font-size="10.5">AG-UI request with messages and state. Endpoint authorization applies.</text>
  <line x1="400" y1="184" x2="400" y2="204" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="206" width="500" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="124" cy="232.0" r="13" fill="#3b82f6"/>
  <text x="124" y="236.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">3</text>
  <text x="400" y="228" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">AG-UI endpoint</text>
  <text x="400" y="246" text-anchor="middle" fill="#94a3b8" font-size="10.5">Resolves the session and loads chat history from SQLite</text>
  <line x1="400" y1="258" x2="400" y2="278" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="280" width="500" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="124" cy="306.0" r="13" fill="#3b82f6"/>
  <text x="124" y="310.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">4</text>
  <text x="400" y="302" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Context providers</text>
  <text x="400" y="320" text-anchor="middle" fill="#94a3b8" font-size="10.5">Governance scan, persona, context, guardrails, profile, entities, RAG chunks, memory</text>
  <line x1="400" y1="332" x2="400" y2="352" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="354" width="500" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="124" cy="380.0" r="13" fill="#3b82f6"/>
  <text x="124" y="384.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">5</text>
  <text x="400" y="376" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">HarnessAgent loop</text>
  <text x="400" y="394" text-anchor="middle" fill="#94a3b8" font-size="10.5">Reason, act, observe. Tools come from every registered provider.</text>
  <line x1="400" y1="406" x2="400" y2="426" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="428" width="500" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="124" cy="454.0" r="13" fill="#3b82f6"/>
  <text x="124" y="458.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">6</text>
  <text x="400" y="450" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Chat pipeline</text>
  <text x="400" y="468" text-anchor="middle" fill="#94a3b8" font-size="10.5">LoopGuard, Reflection, Audit, ModelRouter, ContextBudget, CostTracking, ToolDedupe</text>
  <line x1="400" y1="480" x2="400" y2="500" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="502" width="500" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="124" cy="528.0" r="13" fill="#3b82f6"/>
  <text x="124" y="532.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">7</text>
  <text x="400" y="524" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">LLM provider</text>
  <text x="400" y="542" text-anchor="middle" fill="#94a3b8" font-size="10.5">The model answers or asks for a tool call</text>
  <line x1="400" y1="554" x2="400" y2="574" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="576" width="500" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="124" cy="602.0" r="13" fill="#3b82f6"/>
  <text x="124" y="606.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">8</text>
  <text x="400" y="598" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Tool execution</text>
  <text x="400" y="616" text-anchor="middle" fill="#94a3b8" font-size="10.5">Governance policy, then tracing. Blocked and approval-gated tools stop here.</text>
  <line x1="400" y1="628" x2="400" y2="648" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="650" width="500" height="52" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="124" cy="676.0" r="13" fill="#3b82f6"/>
  <text x="124" y="680.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">9</text>
  <text x="400" y="672" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">SSE event stream</text>
  <text x="400" y="690" text-anchor="middle" fill="#94a3b8" font-size="10.5">Text deltas, tool progress, state, interrupts and run lifecycle events</text>
  <line x1="400" y1="702" x2="400" y2="722" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="724" width="500" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="124" cy="750.0" r="13" fill="#3b82f6"/>
  <text x="124" y="754.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">10</text>
  <text x="400" y="746" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Browser renders</text>
  <text x="400" y="764" text-anchor="middle" fill="#94a3b8" font-size="10.5">Streaming text, tool bar, state panel and approval buttons</text>
  <rect x="150" y="792" width="500" height="70" rx="8" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="400" y="814" text-anchor="middle" fill="#94a3b8" font-size="11">Unattended runs, such as schedules, triggers and orchestrations,</text>
  <text x="400" y="831" text-anchor="middle" fill="#94a3b8" font-size="11">use the same pipeline and tool wrapping. Each is recorded in the run ledger</text>
  <text x="400" y="848" text-anchor="middle" fill="#94a3b8" font-size="11">and counted against spend limits.</text>
</svg>
